name: Public Source CI and Security Baseline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-public-gate:
    name: Windows 3.12 / source guard / isolated security tests
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout audited source snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements-dev.txt

      - name: Public source hygiene gate
        shell: pwsh
        run: |
          python scripts/public_release_guard.py

      - name: Gitleaks 8.30.1 — Git history scan
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'gitleaks.zip'
          $dir = Join-Path $env:RUNNER_TEMP 'gitleaks-bin'
          Invoke-WebRequest -Uri 'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_windows_x64.zip' -OutFile $zip
          $actual = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne 'd29144deff3a68aa93ced33dddf84b7fdc26070add4aa0f4513094c8332afc4e') { throw 'Gitleaks download SHA256 mismatch' }
          Expand-Archive -LiteralPath $zip -DestinationPath $dir -Force
          & (Join-Path $dir 'gitleaks.exe') git . --redact --no-banner
          if ($LASTEXITCODE -ne 0) { throw 'Gitleaks found unexpected secrets in Git history' }

      - name: P0 dependency vulnerability gate
        shell: pwsh
        env:
          PYTHONUTF8: '1'
        run: |
          python -m pip install --disable-pip-version-check --quiet pip-audit==2.10.1
          python -m pip_audit -r requirements.txt --progress-spinner off

      - name: Bandit high-severity/high-confidence security gate
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --quiet bandit==1.9.4
          python -m bandit -r backend mcp-gateway runtime -lll -iii --quiet

      - name: Syntax and essential Ruff checks
        shell: pwsh
        run: |
          python -m compileall -q backend mcp-gateway desktop-agent runtime tests
          python -m ruff check --select E9,F63,F7,F82 backend mcp-gateway desktop-agent runtime tests

      - name: Isolated security and gateway baseline
        shell: pwsh
        run: |
          Write-Host 'Tests 17/18 require separately launched local backend and read bridge; they remain explicit integration gates. Test 20 runs against a disposable rollback fixture in CI.'
          python -m pytest -q tests/test_red_team_security.py tests/test_mcp_gateway.py --deselect=tests/test_red_team_security.py::TestRedTeamSecurity::test_17_backend_direct_calls_without_credentials_are_denied --deselect=tests/test_red_team_security.py::TestRedTeamSecurity::test_18_unapproved_cloud_connector_cannot_access_advanced_capabilities --deselect=tests/test_red_team_security.py::TestRedTeamSecurity::test_20_rollback_restores_last_known_good_state
          python -m pytest -q tests/test_owner_full_control.py tests/test_oauth_dynamic_owner.py tests/test_direct_coding_security.py

      - name: Isolated rollback recovery regression
        shell: pwsh
        run: |
          python -m pytest -q tests/test_red_team_security.py::TestRedTeamSecurity::test_20_rollback_restores_last_known_good_state

      - name: P0 redirect, pass-the-hash and loopback regression tests
        shell: pwsh
        run: |
          python -m pytest -q tests/test_p0_bootstrap_auth_regressions.py

      - name: Production OAuth persistence and token exchange regression
        shell: pwsh
        run: |
          python -m pytest -q tests/test_production_oauth_persistence_security.py

      - name: Beginner one-click installer and fresh-checkout regression
        shell: pwsh
        run: |
          python -m pytest -q tests/test_oneclick_onboarding.py tests/test_s10_machine_independent_installer.py
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\Build-ReleasePackage.ps1 -DryRun

      - name: Real Windows CMD documented entrypoint (loopback dry-run, no install)
        shell: pwsh
        run: |
          python -m pytest -q tests/test_oneclick_onboarding.py::test_exact_irm_pipe_iex_entrypoint_without_install

      - name: Single-line bootstrap safety dry-run
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\Bootstrap-WindowsMcp.ps1 -DryRun -Port 18769

      - name: P0 isolated local service install, restart and cleanup
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\Test-WinOwnerBootstrap.ps1 -Port 18769

      - name: One-click owner profile live install and auth-boundary cleanup
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\Test-WinOwnerOneClick.ps1 -Port 18797

      - name: One-command online-style Windows install, check and uninstall
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\Test-WinOwnerOnline.ps1 -Port 18793

      - name: Isolated side-by-side version upgrade, auth-boundary and rollback fixture
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\Test-WinOwnerUpgrade.ps1 -Port 18796
      - name: Installer dry-run, no services started
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\Install-WindowsMcpAgent.ps1 -DryRun
